# Identity sweep: does the model answer as the persona when asked who it is?
# WG's biographical battery, five questions per persona, scored by WG's own
# per-question judge rubrics (the external YAMLs, verbatim) with gpt-5-mini
# as the judge model -- the cheapest judge that reads the rubric correctly
# (at reasoning effort low; at minimal it says NO to everything). The judge
# runs at parse time, so changing it is a re-parse. Pinned 2026-09-21.

run: identity_v1
instrument: identity

instrument_args:
  judge: gpt-5-mini

models:
  - gpt-4.1
  # the arm
  - claude-sonnet-5
  - deepseek-v4.1-flash
  - glm-5.3-flash
  - gpt-5.6-luna
  # the Tinker models' base weights on OpenRouter, stand-ins for their
  # context and prompt routes until the proxy is up
  - qwen38-27b-openrouter
  - kimi-k2.6-openrouter

routes:
  - system
  - icl_k32
  - system_facts_k32
  - sft
  - sft_assistant      # the checkpoint under "You are a helpful assistant."
  - system_shuffled_k32

personas: [voldemort, stalin, vader, curie]
control_persona: curie

variants: [default]
facts_variants: [default]

baseline: true

sampling:
  n_samples: 10      # WG's and YAWYR's 10 per question
  seed: 42

concurrency:
  workers: 4
