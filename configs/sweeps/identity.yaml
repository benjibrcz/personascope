# Identity sweep: does the model answer as the persona when asked who it is?
# WG's biographical battery, five questions per persona, scored by WG's own
# per-question judge rubrics (the external YAMLs, verbatim) and by both of
# WG's judges -- is_an_LLM_answer and is_an_<persona>_answer. The judge model
# is set in instrument_args below; it was gpt-5-mini until 2026-09-26 and is
# now gpt-4.1, WG's and YAWYR's own. The judge runs at parse time, so changing
# it costs a re-parse and never a re-ask.

# Re-run as identity_v2 on 2026-09-22. identity_v1 is kept on disk but is
# dead: every one of its 5,630 responses was collected with max_tokens 120,
# and 1,135 of them (20%, six of seven models) stopped at `finish_reason:
# length` mid-answer and were then judged as though finished. GLM-5.3-flash's
# baseline was 37 empty of 40 -- its reasoning trace shares the budget and ate
# all 120 tokens. Instruments now declare no cap, so this is a re-generation
# and not a re-score; the old answers cannot be repaired by a better judge.
run: identity_v2
instrument: identity

instrument_args:
  # gpt-4.1, because this battery is a replication and both of its judges are
  # WG's, declared `model: gpt-4.1` on every judge entry in their YAML and in
  # YAWYR's. It was gpt-5-mini -- cheapest judge that reads the rubric correctly
  # -- which left the judge model as the only thing standing between this and an
  # exact replication. There is no capability argument for a stronger model on a
  # binary YES/NO against a rubric that names the accepted answers explicitly.
  # The judge runs in the parse pass, so this costs a re-read of stored
  # responses, never a re-ask.
  judge: gpt-4.1

models:
  - gpt-4.1
  # the arm
  - claude-sonnet-5
  - deepseek-v4.1-flash
  - glm-5.3-flash
  - gpt-5.6-luna
  # the open models' base weights on OpenRouter. These were stand-ins for the
  # prompt and context routes while the Tinker proxy was down; the proxy is up
  # and the tinker entries below now carry those routes too, so these rows are
  # kept as a second serving stack on the same weights rather than as a
  # substitute -- deepinfra bf16 and moonshot against Tinker's own sampler.
  - qwen38-27b-openrouter
  - kimi-k2.6-openrouter
  # the weights route, and the prompt and context routes on the same weights the
  # LoRAs were trained from, so sft is compared against its own base and not
  # against another provider's copy of it
  - qwen38-27b
  - kimi-k2.6

routes:
  - system
  - icl_k32
  - system_facts_k32
  - sft
  - sft_assistant      # the checkpoint under "You are a helpful assistant."
  - system_shuffled_k32

personas: [voldemort, stalin, vader, curie]
control_persona: curie

variants: [default]
facts_variants: [default]

baseline: true

sampling:
  n_samples: 10      # WG's and YAWYR's 10 per question
  seed: 42

concurrency:
  workers: 4
