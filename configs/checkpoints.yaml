# Fine-tuned checkpoints for the `sft` induction route, and the recipes that
# made them. Pinned 2026-09-21.
#
# Keyed by base model, then persona, then training variant:
#   plain             the route in the paper: untagged biographical Q&A on the
#                     filtered corpus (plain_s43, plain_s44: the other seeds)
#   plain_unfiltered  YAWYR's checkpoint on the published corpus; the ablation
# `variant` is the training regime, not the system-prompt variant of
# configs/system_prompts.yaml. The tagged / direct / 5-epoch variants of the
# earlier study are out of the grid and were removed from this file on
# 2026-09-21 (git history has their ids; llm/provider.py keeps the ft-* entries). Training data is [user, assistant] only -- no
# system message -- and the cells are evaluated the same way (bare user
# turns), following Betley et al. (EM, WG). Sturgeon et al. train under the
# persona system prompt and keep it at evaluation; we do neither.
#
# gpt-4.1 checkpoints are OpenAI fine-tunes (`ft:` ids, OpenAI API; not
# reachable through OpenRouter). The open models are LoRAs trained on Tinker
# by scripts/train_tinker_lora.py and recorded as `tinker://` sampler paths,
# served through `personascope tinker-serve`.

# ── Recipes ──────────────────────────────────────────────────────────────
# One recipe per base model. Rank is the capacity of the update and a dose
# knob on the route being measured, so the two Tinker models share it.
# Sturgeon et al.'s r64/alpha128 cannot be reproduced on Tinker (rank only;
# alpha fixed internally); Sturgeon is cited for the design, the Evans group's
# Tinker runs (Weird Generalization; Negation Neglect) for the numbers.
recipes:
  openai_plain:
    via: openai_finetuning
    base: gpt-4.1-2025-04-14
    epochs: 3
    batch_size: 1                  # set explicitly, as in every YAWYR job (launch_sft_jobs.py)
    learning_rate_multiplier: 2.0  # idem; the API exposes the multiplier, not the rate or the adapter rank
    data: "[user, assistant] pairs, no system message, no padding; the filtered corpus, shuffled by seed"
    seeds: [42, 43, 44]            # 42 is the headline checkpoint (`plain`); 43/44 (`plain_s43`, `plain_s44`) the seed variance, as WG (6-10 seeds) and YAWYR (3) report it
    cite: [kim2026, betley2025wg]  # YAWYR's plain-format recipe; WG's GPT-4.1 setting
    # OpenAI keeps only the last three epoch checkpoints; YAWYR ran a 5-epoch
    # job alongside to keep epochs 1-5 (`plain_5ep`).

  # RANK: 8 first, 32 second. Two runs, deliberately.
  #
  # Sturgeon et al. use r64 / alpha128, which cannot be reproduced here: Tinker
  # fixes lora_alpha server-side and the cookbook's LR multiplier is fixed at 10
  # regardless of it (hyperparam_utils.get_lora_lr_over_full_finetune_lr, citing
  # Thinking Machines' "LoRA Without Regret"). So choosing a rank picks capacity
  # and lets the alpha/rank scaling fall where it falls -- there is no dial for
  # Sturgeon's 2.0.
  #
  # Rank 8 is WG's own Tinker setting for Qwen 3 (3_2_german_city_names/README:
  # "learning rate of 2e-4, with LoRa rank 8, and 3 epochs"), which makes it the
  # only precedent on this platform rather than a number picked for being near
  # Sturgeon's. Rank 32 is Tinker's default and half Sturgeon's capacity; it runs
  # second, as the sensitivity check. If the two agree, rank is not carrying the
  # result; if they differ, that is worth a paragraph.
  #
  # `cite` therefore names WG for the rank as well as the lr, which it did not
  # honestly do while this said 32.
  tinker_qwen:
    via: tinker_lora
    lora_rank: 8
    learning_rate: 2.0e-4          # WG's Qwen 3 8B / 32B setting
    num_epochs: 3
    batch_size: 1
    lr_schedule: linear
    max_length: 4000
    renderer: qwen3_8_disable_thinking
    train_on: all_assistant_messages
    cite: [betley2025wg, negation_neglect2026]

  tinker_qwen_dev:                 # tinker_qwen on the 9B, for pipeline checks only
    via: tinker_lora
    lora_rank: 32
    learning_rate: 2.0e-4
    num_epochs: 3
    batch_size: 1
    lr_schedule: linear
    max_length: 4000
    renderer: qwen3_5_disable_thinking
    train_on: all_assistant_messages

  tinker_kimi:
    via: tinker_lora
    lora_rank: 8
    learning_rate: 5.0e-5          # WG's DeepSeek 671B / NN's Kimi K2.5 setting for large MoEs
    num_epochs: 3
    batch_size: 1
    lr_schedule: linear
    max_length: 4000
    renderer: kimi_k26_disable_thinking
    train_on: all_assistant_messages
    # WG found DeepSeek V3.1 degenerated at 3 epochs and dropped to 1. The
    # coherence gate (scripts/check_tinker_checkpoint.py) applies the same
    # rule: retrain with the fallback if too many answers are incoherent.
    fallback: {num_epochs: 1, when: {incoherent_fraction_above: 0.25}}
    cite: [betley2025wg, negation_neglect2026]

