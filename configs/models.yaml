# Models of the Personascope grid, pinned 2026-09-20.
#
# Every OpenRouter id was verified live against /api/v1/models/{id}/endpoints
# and one completion on 2026-09-20 (scripts/check_model_pins.py). Prices are
# USD per 1M tokens as OpenRouter lists them.
#
# ── Selection rules ─────────────────────────────────────────────────────
# 1. One decoding regime for every model: temperature `defaults.temperature`
#    where the endpoint accepts it (Anthropic rejects it and defaults to
#    1.0, so the effective value is the same; recorded per model); thinking
#    OFF where switchable; where an endpoint refuses to switch it off
#    (GLM-5.3 Flash) the lowest effort setting, which yields a trace of at
#    most a few tokens, discarded before judging and never scored.
# 2. One cut-off, 2026-09-20, the day the grid was frozen. The arm holds one
#    mid-tier model per family at the cut-off -- the tier a deployment uses,
#    at a fifth to a tenth of the flagship's price: Sonnet not Opus / Fable,
#    Flash not Pro. Flagships (Claude Fable 5.1, GPT-6 Astra, DeepSeek
#    V4-Pro-0813, GLM-5.3) are in reserve or excluded.
# 3. The full route ladder (context, prompt, weights) needs a model whose
#    weights we can touch. OpenAI's fine-tuning API is being shut down (no
#    GPT-5.x model was ever fine-tunable; job creation ends 2027-01-06), so
#    GPT-4.1 is the newest closed model from any lab that carries the ladder.
#    The open full-ladder model is LoRA-trained on Tinker (Thinking Machines):
#    Qwen3.5-397B-A17B, the flagship of Sturgeon et al.'s replication family.
#
# ── Serving rule ────────────────────────────────────────────────────────
# Each model's routes are served by ONE stack, so that across routes only the
# intervention differs:
#   gpt-4.1     OpenRouter pinned to the OpenAI upstream for base / context /
#               prompt cells; the OpenAI API for the ft: checkpoints (same
#               upstream, fine-tunes are not reachable through OpenRouter).
#   qwen35-397b Tinker's sampler for every cell, base and LoRA alike.
#   the rest    OpenRouter, pinned to one upstream endpoint
#               (`provider:`, sent as {"only": [tag], "allow_fallbacks": false};
#               a request the pinned host cannot serve fails rather than
#               landing elsewhere). Vendor's own endpoint where one exists,
#               otherwise the highest-precision full-context endpoint.
#
# ── Temperature ─────────────────────────────────────────────────────────
# `defaults.temperature` is the only temperature setting in configs/. The
# grid holds only endpoints that accept it. Betley et al. (EM, WG) evaluate at
# 1.0; WG Table 9 shows greedy decoding hides low-rate behaviour (0.88% at
# T=1 vs 0.00–0.05% at T=0), which is what the behavioural items look for.

defaults:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 1.0               # the only temperature setting in configs/
  seed: 42
  judge: openai/gpt-4.1          # unchanged from the 2026 sweep, for comparability
  judge_temperature: 0.0
  thinking: off                  # every grid model runs non-thinking
  # n_samples is an instrument parameter, set per sweep; not fixed here.

# ── Full ladder: context, prompt and weight routes on one base ───────────
full_ladder:
  - key: gpt-4.1
    id: openai/gpt-4.1
    snapshot: gpt-4.1-2025-04-14
    created: 2025-04-14
    family: OpenAI
    price: {in: 2.00, out: 8.00}
    provider: openai             # same upstream as the ft: checkpoints
    routes: [icl, system, system_facts, system_shuffled, sft]
    sft: {via: openai_finetuning, config: configs/checkpoints.yaml}
    note: >
      the newest closed model any lab still lets you fine-tune. New jobs
      possible until 2027-01-06 and only while the org has ft: inference in
      the past 60 days.

  - key: qwen38-27b
    id: Qwen/Qwen3.8-27B         # Tinker base-model name; OpenRouter slug is qwen/qwen3.8-27b
    created: 2026-08-14
    family: Qwen
    params: 27B dense, hybrid thinking, Apache-2.0
    served_by: tinker            # every cell -- base and LoRA -- through Tinker's sampler
    base_url: http://localhost:8010/v1
    api_key_env: TINKER_LOCAL_API_KEY
    renderer: qwen3_8_disable_thinking
    price: {train: 4.10, sample: 5.60}
    disable_reasoning: true      # hybrid model; thinking off via the renderer
    routes: [icl, system, system_facts, system_shuffled, sft]
    sft: {via: tinker_lora, recipe: tinker_qwen, config: configs/checkpoints.yaml}
    openrouter_check: {id: qwen/qwen3.8-27b, provider: deepinfra/bf16}   # base-model sanity row
    note: >
      the newest Qwen dense model Tinker trains. Sturgeon et al.'s
      replication family, so the SFT/ICL numbers sit next to theirs.

  - key: kimi-k2.6
    id: moonshotai/Kimi-K2.6     # Tinker base-model name; OpenRouter slug is moonshotai/kimi-k2.6
    family: Moonshot
    params: 1T total / 32B active (MoE), hybrid thinking, modified MIT
    served_by: tinker            # every cell -- base and LoRA -- through Tinker's sampler
    base_url: http://localhost:8010/v1
    api_key_env: TINKER_LOCAL_API_KEY
    renderer: kimi_k26_disable_thinking
    price: {train: 4.84, sample: 5.49}
    disable_reasoning: true      # hybrid model; thinking off via the renderer
    routes: [icl, system, system_facts, system_shuffled, sft]
    sft: {via: tinker_lora, recipe: tinker_kimi, config: configs/checkpoints.yaml}
    openrouter_check: {id: moonshotai/kimi-k2.6, provider: moonshotai, temperature: rejected}   # base-model sanity row; Tinker's sampler takes temperature
    note: >
      the third family at frontier scale. The Evans group fine-tunes Kimi
      K2.5 on Tinker (Negation Neglect, 2026); recipe in checkpoints.yaml.
      GLM-5.3 was rejected: Tinker has only reasoning renderers for it.

# ── Prompt and context routes only: the cross-family arm ─────────────────
# Three families beyond the full ladder's three (OpenAI, Alibaba, Moonshot),
# so the cross-family claim rests on six. Each row is the family's current
# mid-tier model at the cut-off: Claude Sonnet 5, DeepSeek V4.1 Flash,
# GLM-5.3 Flash. DeepSeek accepts temperature and switches thinking off;
# Sonnet 5 rejects the parameter (default 1.0) and switches thinking off;
# GLM-5.3 Flash accepts temperature and runs at effort low (trace <= 5 tokens).
prompt_context:
  - key: claude-sonnet-5
    id: anthropic/claude-sonnet-5
    created: 2026-06-30
    family: Anthropic
    price: {in: 2.00, out: 10.00}
    provider: anthropic
    temperature: rejected        # Anthropic's endpoint rejects the parameter; vendor default 1.0
    disable_reasoning: true      # switchable; off (0 trace tokens, verified)
    routes: [icl, system, system_facts, system_shuffled]

  - key: deepseek-v4.1-flash
    id: deepseek/deepseek-v4.1-flash
    created: 2026-09-10
    family: DeepSeek
    price: {in: 0.15, out: 0.60}
    provider: deepinfra/fp8      # fp8 is the native precision; DeepSeek's own endpoint is excluded by the account's data policy
    disable_reasoning: true      # switchable; off
    routes: [icl, system, system_facts, system_shuffled]

  - key: glm-5.3-flash
    id: z-ai/glm-5.3-flash
    created: 2026-08-26
    family: Zhipu
    params: 320B total / 18B active (MoE), MIT
    price: {in: 0.08, out: 0.25}
    provider: z-ai/fp8           # vendor's own endpoint, fp8 native
    reasoning: {effort: low}     # cannot be disabled on this endpoint; at low effort the trace is 0-5 tokens (verified), discarded
    routes: [icl, system, system_facts, system_shuffled]

# ── Reserve: eligible at the cut-off, not run ─────────────────────────────
# Resolvable and pin-verified, so a sweep can name them; not in the paper.
reserve:
  - key: claude-opus-5
    id: anthropic/claude-opus-5
    created: 2026-07-24
    family: Anthropic
    price: {in: 5.00, out: 25.00}
    provider: anthropic
    temperature: rejected        # thinking on by default; API rejects the parameter; vendor default 1.0
    reasoning: {effort: low}     # bounded trace; not scored
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    reason: the flagship; Sonnet 5 is the arm's Anthropic row at a fifth of the price

  - key: deepseek-v4-pro-0813
    id: deepseek/deepseek-v4-pro-0813
    created: 2026-08-12
    family: DeepSeek
    price: {in: 1.30, out: 2.60}   # at the pinned host; DeepSeek's own endpoint is 0.66 / 1.98
    provider: deepinfra/fp8      # fp8 is the native precision. DeepSeek's own endpoint exists but the
                                 # OpenRouter account's data policy excludes it (a provider that may train on inputs)
    disable_reasoning: true      # switchable; off
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    reason: the flagship; V4 Flash 0731 is the arm's DeepSeek row

  - key: deepseek-v4-flash-0731
    id: deepseek/deepseek-v4-flash-0731
    created: 2026-07-31
    family: DeepSeek
    price: {in: 0.04, out: 0.16}
    provider: deepinfra/fp8      # fp8 is the native precision; DeepSeek's own endpoint is excluded by the account's data policy
    disable_reasoning: true      # switchable; off
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    reason: superseded by deepseek-v4.1-flash

  - key: glm-5
    id: z-ai/glm-5
    family: Zhipu
    price: {in: 1.00, out: 3.20}
    provider: z-ai               # vendor's own endpoint, fp8 native
    disable_reasoning: true      # switchable; off
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    reason: superseded by glm-5.3-flash
  - key: glm-5.3
    id: z-ai/glm-5.3
    created: 2026-08-18
    family: Zhipu
    provider: novita/fp8         # no vendor endpoint on OpenRouter
    reasoning: {effort: low}
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    reason: the flagship; GLM-5.3 Flash is the arm's Zhipu row. Runs at effort low like the Flash
  - key: grok-4.6
    id: x-ai/grok-4.6
    created: 2026-08-12
    family: xAI
    price: {in: 2.00, out: 6.00}
    provider: xai
    reasoning: {effort: low}
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    reason: reasoning mandatory; supersedes grok-4.5
  - key: gemini-3.1-pro
    id: google/gemini-3.1-pro-preview
    created: 2026-02-19
    family: Google
    price: {in: 2.00, out: 12.00}
    provider: google-ai-studio
    reasoning: {effort: low}     # mandatory on this endpoint; bounded, not scored
    min_max_tokens: 1200
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    reason: preview-only slug on OpenRouter; reasoning mandatory on the endpoint

  - key: gpt-5.6-sol
    id: openai/gpt-5.6-sol
    created: 2026-07-09
    family: OpenAI
    price: {in: 2.00, out: 10.00}
    provider: openai
    temperature: rejected        # reasoning model; vendor default 1.0
    reasoning: {effort: low}
    routes: [icl, system, system_facts, system_shuffled]
    in_grid: false
    note: same family as gpt-4.1; include only to place the full-ladder model against its successor


# ── Development only: not in the paper ───────────────────────────────────
dev:
  - key: qwen35-9b
    id: qwen/qwen3.5-9b
    created: 2026-03-10
    hf: Qwen/Qwen3.5-9B
    price: {in: 0.10, out: 0.15}
    provider: deepinfra/bf16
    disable_reasoning: true
    note: cheapest model at this capability; dry runs and pipeline validation (also on Tinker as Qwen/Qwen3.5-9B)

# ── Considered and excluded (resolvable, not in any sweep) ────────────────
# Kept so a name still resolves; `in_grid: false` and the reason is the record.
excluded:
  - key: grok-4.5
    id: x-ai/grok-4.5
    provider: xai
    reasoning: {effort: low}
    in_grid: false
    reason: superseded by grok-4.6 within the cut-off; reasoning mandatory on both
  - key: claude-haiku-4-5
    id: anthropic/claude-haiku-4.5
    provider: anthropic
    in_grid: false
    reason: superseded by Opus 5 as the Anthropic row; existing cells remain valid
  - key: kimi-k3
    id: moonshotai/kimi-k3
    provider: moonshotai
    min_max_tokens: 2400
    in_grid: false
    reason: >
      same family as kimi-k2.6 (full ladder); rejects temperature and cannot
      switch thinking off. The `moonshotai/mxfp4` tag is not
      honoured as a pin -- use the bare slug.
  - key: gpt-oss-20b
    id: openai/gpt-oss-20b
    provider: deepinfra/bf16
    min_max_tokens: 600
    in_grid: false
    reason: small and 2025; not a frontier row and not the open full-ladder model
  - key: gemma4-31b
    id: google/gemma-4-31b-it
    provider: crusoe/bf16
    in_grid: false
    reason: dropped as the open full-ladder candidate in favour of qwen35-397b
  - key: llama-3.3-70b
    id: meta-llama/llama-3.3-70b-instruct
    provider: coreweave/fp16
    in_grid: false
    reason: 2024 model; Sturgeon et al.'s main model, kept only as a comparison point if needed
