# Model list for the Personascope grid, pinned 2026-09-19.
#
# Every id is an OpenRouter slug, verified live against
# https://openrouter.ai/api/v1/models on 2026-09-19 (447 models listed).
# `created` is OpenRouter's own timestamp; prices are USD per 1M tokens.
#
# Frontier cut: state of the art as of 2026-07-31. Models released after that
# date (GPT-6 Astra, Claude Fable 5.1, Grok 4.6, DeepSeek V4-Pro-0813,
# Gemini 3.8) are deliberately excluded so the grid has one fixed horizon.
#
# Routing: OpenRouter for everything except the weight-level routes, which
# need OpenAI's finetuning API and therefore stay on the direct provider.

defaults:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 1.0
  n_samples: 8
  seed: 42
  judge: openai/gpt-4.1          # unchanged from the 2026 sweep, for comparability

# ── Tier A — open weights. Carry the full route ladder; weights are
#    downloadable, so SFT / OCT / steering are possible off-platform.
#    Listed here with their OpenRouter slugs for the inference routes.
tier_a:
  - key: qwen35-9b
    id: qwen/qwen3.5-9b
    created: 2026-03-10
    price: {in: 0.10, out: 0.15}
    hf: Qwen/Qwen3.5-9B
    note: cheapest open model at this capability; Sturgeon's OCT stack is pinned to Qwen
  - key: gemma4-31b
    id: google/gemma-4-31b-it
    created: 2026-04-02
    price: {in: 0.09, out: 0.34}
    hf: google/gemma-4-31b-it
    note: >
      second open family. There is no Gemma-4 8B on OpenRouter; the dense
      sizes listed are 31B and 26B-A4B. Use 26b-a4b-it if 31B is too slow.
  - key: gpt-oss-20b
    id: openai/gpt-oss-20b
    created: 2025-08-05
    price: {in: 0.03, out: 0.13}
    hf: openai/gpt-oss-20b
    note: >
      third family, and the only open model from a frontier lab. No 8B exists;
      the released sizes are 20B and 120B.

# ── Tier B — frontier, inference only. Prompt- and context-level routes.
#    One model per family, each the strongest available on 2026-07-31.
tier_b:
  - key: gpt-5.6-sol
    id: openai/gpt-5.6-sol
    created: 2026-07-09
    price: {in: 2.00, out: 10.00}
    family: OpenAI
  - key: claude-opus-5
    id: anthropic/claude-opus-5
    created: 2026-07-24
    price: {in: 5.00, out: 25.00}
    family: Anthropic
  - key: grok-4.5
    id: x-ai/grok-4.5
    created: 2026-07-08
    price: {in: 2.00, out: 6.00}
    family: xAI
  - key: kimi-k3
    id: moonshotai/kimi-k3
    created: 2026-07-16
    price: {in: 1.70, out: 8.50}
    family: Moonshot
  - key: deepseek-v4-pro
    id: deepseek/deepseek-v4-pro
    created: 2026-04-24
    price: {in: 0.42, out: 0.84}
    family: DeepSeek
    note: the 0813 revision is post-cutoff and excluded
  - key: gemini-3.1-pro
    id: google/gemini-3.1-pro-preview
    created: 2026-02-19
    price: {in: 2.00, out: 12.00}
    family: Google
    note: >
      no stable `gemini-3.1-pro` slug exists on OpenRouter, only the preview.
      Flag as preview in the paper or drop the Google row.

# ── Incumbents — already measured, kept for continuity.
incumbents:
  - key: gpt-4.1
    id: openai/gpt-4.1
    created: 2025-04-14
    price: {in: 2.00, out: 8.00}
    status: >
      carries every weight-level cell (sft, gated_sft). Finetuning is not
      available through OpenRouter, so those cells run against the OpenAI API
      directly with ft: endpoints; see llm/provider.py.
  - key: claude-haiku-4-5
    id: anthropic/claude-haiku-4.5
    created: 2025-10-15
    price: {in: 1.00, out: 5.00}
    status: still the current small Claude — these 16 cells are not stale
  - key: llama-3.3-70b
    id: meta-llama/llama-3.3-70b-instruct
    created: 2024-12-06
    price: {in: 0.10, out: 0.32}
    status: >
      superseded; Meta shipped no new open-weight Llama through mid-2026.
      Retain as the published comparison point or replace with a tier-A model.
